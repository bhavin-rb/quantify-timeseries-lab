services:
  server:
    build:
      context: ./server
    container_name: timeseries-lab-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      TIINGO_API_KEY: ${TIINGO_API_KEY}
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: timeseries-lab-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped